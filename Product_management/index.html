<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <link href="./css/index.css" rel="stylesheet">
    
  </style>
</head>

<body>


<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand">Product Management</span>
  <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#productModal">
    + Add
  </button>
</nav>

<div class="container mt-4">


  <div class="row mb-3">
    <div class="col-md-4">
      <input type="text" id="filterId" class="form-control" placeholder="Filter by Product ID">
    </div>

    <div class="col-md-4">
      <select id="sortBy" class="form-select">
        <option value="">Sort By</option>
        <option value="id">Product ID</option>
        <option value="name">Product Name</option>
        <option value="price">Price</option>
      </select>
    </div>

    <div class="col-md-4">
      <button id="applyFilter" class="btn btn-primary w-100">Apply</button>
    </div>
  </div>


  <div class="table-responsive">
    <table class="table table-bordered table-hover align-middle text-center">
      <thead class="table-dark">
        <tr>
          <th>Product ID</th>
          <th>Name</th>
          <th>Image</th>
          <th>Price</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="productTable">
       
        <tr>
          <td>101</td>
          <td>Sample Product</td>
          <td>
            <img src="https://via.placeholder.com/50" />
          </td>
          <td>₹499</td>
          <td>Demo description</td>
          <td>
            <button class="btn btn-sm btn-warning me-2"
              data-bs-toggle="modal"
              data-bs-target="#productModal">
              Update
            </button>
            <button class="btn btn-sm btn-danger">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>


<div class="modal fade" id="productModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Product Form</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form id="productForm">

          <div class="mb-3">
            <label class="form-label">Product ID</label>
            <input id="productId" ype="number" class="form-control" min="1" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input id="productName" type="text" class="form-control" minlength="3" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Image URL</label>
            <input id="productImage" type="text" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Price</label>
            <input id="productPrice" type="number" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea id="productDesc" class="form-control" rows="3" minlength="10" required></textarea>
          </div>

          <button class="btn btn-success w-100">Save Product</button>

        </form>
      </div>

    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./js/main.js"></script>

</body>
</html>
