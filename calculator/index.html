<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.csscustom.css" rel="stylesheet"> -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./css/calculator.css"> 
    <title>Document</title>
</head>
<body>
    <div class="container-fluid py-1.5" style="max-width: 400px; max-height: 800px; background:rgb(247, 246, 246);">
    <div class="row p-3" style="height:120px;">
        <input type="text" class="form-control text-end" id="display" placeholder="0" value="0">
    </div>
    <div class="row p-3 justify-content-start">
        <div class="col-2 p-0">
            <button value="DEG" type="button" class="btn w-100" data-operator="degree">DEG</button>
        </div>
        <div class="col-2 p-0">
            <button value="FE" type="button" class="btn w-100" data-operator="fe">F-E</button>
        </div>
    </div>
    <div class="row align-items-center gx-3">
        <div class="col d-flex justify-content-center p-0" style="background-color: transparent;">
            <button type="button" class="btn w-100" data-operator="mc">MC</button>
        </div>
        <div class="col d-flex justify-content-center p-0" style="background-color: transparent;">
            <button type="button" class="btn w-100" data-operator="mr">MR</button>
        </div>
        <div class="col d-flex justify-content-center p-0" style="background-color: transparent;">
            <button type="button" class="btn w-100" data-operator="m+">M+</button>
        </div>
        <div class="col d-flex justify-content-center p-0" style="background-color: transparent;">
            <button type="button" class="btn w-100" data-operator="m-">M-</button>
        </div>
        <div class="col d-flex justify-content-center p-0" style="background-color: transparent;">
            <button type="button" class="btn w-100" data-operator="ms">MS</button>
        </div>

    </div>
    <div class="row p-3">
        <div class="col-5 p-0">
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Trignometry
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">sin()</a></li>
                    <li><a class="dropdown-item" href="#">cos()</a></li>
                    <li><a class="dropdown-item" href="#">tan()</a></li>
                </ul>
            </div>
        </div>
        <div class="col-5 p-0">
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    Function
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Action</a></li>
                    <li><a class="dropdown-item" href="#">Another action</a></li>
                    <li><a class="dropdown-item" href="#">Something else here</a></li>
                </ul>
            </div>
        </div>
    </div>
    <div class="row my-1 gx-3">
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="2nd">2<sup>nd</sup></button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="pi">&#928;</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="exponent of 10">e</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="clear" type="button" class="btn w-100" data-action="Clear">C</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="backspace" type="button" class="btn w-100" data-action="back_space"><img style="width: 20px;" src="public/delete.png"></button>
        </div>
    </div>
    <div class="row my-1 gx-3">
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="square">x<sup>2</sup></button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="reciprocal">1/x</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="bar">|x|</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="exponent">exp</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="mod">mod</button>
        </div>
    </div>
    <div class="row my-1 gx-3">
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="square-root">&#178;&#8730;x</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="opening-parenthesis">&lpar;</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="closing-parenthesis">&rpar;</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="factorial">n!</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="/" type="button" class="btn w-100" data-operator="divide">&divide;</button>
        </div>
    </div>
    <div class="row my-1 gx-3">
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="x-exponent-y">x<sup>y</sup></button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="7" type="button" class="btn w-100" data-value="7">7</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="8" type="button" class="btn w-100" data-value="8">8</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="9" type="button" class="btn w-100" data-value="9">9</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="*" type="button" class="btn w-100" data-operator="multiply">x</button>
        </div>
    </div>
    <div class="row my-1 gx-3">
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="10-exponent-x">10<sup>x</sup></button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="4" type="button" class="btn w-100" data-value="4">4</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="5" type="button" class="btn w-100" data-value="5">5</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="6" type="button" class="btn w-100" data-value="6">6</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="-" type="button" class="btn w-100" data-operator="subtract">-</button>
        </div>
    </div>
    <div class="row my-1 gx-3">
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="log">log</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="1" type="button" class="btn w-100" data-value="1">1</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="2" type="button" class="btn w-100" data-value="2">2</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="3" type="button" class="btn w-100" data-value="3">3</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="+" type="button" class="btn w-100" data-operator="add">+</button>
        </div>
    </div>
    <div class="row my-1 gx-3">
        <div class="col d-flex justify-content-center p-0">
            <button type="button" class="btn w-100" data-operator="natural-log">ln</button>
        </div>
        <div class="col d-flex justify-content-center p-0"  style="background-color: white;">
            <button type="button" class="btn w-100" data-operator="sign-toggle">+/-</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button value="0" type="button" class="btn w-100" data-value="0">0</button>
        </div>
        <div class="col d-flex justify-content-center p-0" style="background-color: white;">
            <button type="button" class="btn w-100" data-operator="dot">.</button>
        </div>
        <div class="col d-flex justify-content-center p-0">
            <button type="submit" onsubmit="calc()" class="btn w-100" data-action="equals">=</button>
        </div>
    </div>
    <!-- type module is used to import and export functions and variables from other js files -->
    <script type="module" src="./js/calculatorClass.js"></script> 
</body>
</html>
